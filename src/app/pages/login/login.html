<div class="content-container">

  <h1>Login</h1>

  <p>
    Acesse sua conta da Fintech CRUD.
  </p>

  <form>

    <label for="email">
      Login
    </label>

    <br>

    <input
      class="input-simples"
      id="email"
      name="email"
      type="email"
      placeholder="Digite seu email"
      [(ngModel)]="login"
      (keyup)="validarFormulario()"
      (keydown)="teclaDigitada($event)"
    />

    <label for="input-senha">
      Senha
    </label>

    <br>

    <input
      class="input-simples"
      id="input-senha"
      name="input-senha"
      type="password"
      placeholder="Digite sua senha"
      [(ngModel)]="senha"
      (keyup)="validarFormulario()"
    />

    <button
      type="button"
      class="input-submeter"
      [disabled]="botaoDesabilitado"
      (click)="fazerLogin()"
    >
      Confirmar
    </button>

  </form>

</div>
