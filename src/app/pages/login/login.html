<div class="content-container">

    <form>
      <label fo="email">
        Login
      </label>

      <br>

      <input class="input-simples" id="email" name="email"
      type="emial"
      placeholder="Digite seu email"
      [(ngModel)]="login"
      (keyup)="validarFormulario()"
      />
  
      <label for="input-senha">Senha</label>

      <br>

      <input class="input-simples" id="input-senha" name="input-senha"
      type="password"
      placeholder="Digite sua senha"
      [(ngModel)]="senha"
      (keyup)="validarFormulario()"
       />

       <button class="input-submeter" [disabled]="botaoDesabilitado"
       (click)="fazerLogin()">
       confirmar
      </button>

    </form>
    
</div>
